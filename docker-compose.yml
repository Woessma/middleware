services:
 
  middleware:
    build: .
    environment:
      - DEBUG_MODE=true
      - CORS_ALLOW_ORIGINS=http://localhost:8081,http://127.0.0.1:8081,http://localhost:8082,http://127.0.0.1:8082,http://10.20.30.212:8081,http://10.20.30.212:8082
      - FHIR_BASE=${FHIR_BASE:-http://hapi-fhir:8080/fhir}
      - FHIR_EXTERNAL_BASE_URL=${FHIR_EXTERNAL_BASE_URL:-https://fhir.woess.ch/fhir}
      - FHIR_EXTERNAL_USERNAME=${FHIR_EXTERNAL_USERNAME:-}
      - FHIR_EXTERNAL_PASSWORD=${FHIR_EXTERNAL_PASSWORD:-}
      - FHIR_EXTERNAL_TIMEOUT=${FHIR_EXTERNAL_TIMEOUT:-5}
      - TERMINOLOGY_BASE_URL=https://tx.fhir.ch/r4
      - REFDATA_API_KEY=${REFDATA_API_KEY:-}
      - EPIC_PUBLIC_KEY_PATH=/run/epic/epic-public.pem
      - EPIC_JWKS_KID=${EPIC_JWKS_KID:-epic-key-1}
      - BRIDGELINK_CDA_IMPORT_URL=${BRIDGELINK_CDA_IMPORT_URL:-https://api.omnilink.ch/v1/cda/import}
      - BRIDGELINK_EMEDIPLAN_IMPORT_URL=${BRIDGELINK_EMEDIPLAN_IMPORT_URL:-https://api.omnilink.ch/v1/emediplan/import}
      - HUSKY_VALIDATOR_URL=http://husky-validator:8091
      - PMLC_KEYCLOAK_ISSUER=${PMLC_KEYCLOAK_ISSUER:-https://idp.omnilink.ch/realms/omnilink}
      - PMLC_KEYCLOAK_AUDIENCE=${PMLC_KEYCLOAK_AUDIENCE:-}
      - PMLC_KEYCLOAK_ALLOWED_CLIENTS=${PMLC_KEYCLOAK_ALLOWED_CLIENTS-app-omnilink-cardtest}
      - PMLC_KEYCLOAK_REQUIRED_ROLE=${PMLC_KEYCLOAK_REQUIRED_ROLE:-}
    volumes:
      - type: bind
        source: ${EPIC_PUBLIC_KEY_HOST_PATH:-/home/ansibleadmin/.local/share/omnilink/epic/epic-public.pem}
        target: /run/epic/epic-public.pem
        read_only: true
        bind:
          create_host_path: false
    container_name: python-middleware
    ports:
      - "8000:8000"
      - "8082:8000"
    networks:
      - default
      - proxy
      - validation
    restart: unless-stopped

  husky-validator:
    build: ./husky-validator
    volumes:
      - ./husky-validator/definitions:/definitions:ro
    networks:
      - validation
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    pids_limit: 64
    restart: unless-stopped
 
networks:
  validation:
    internal: true
  proxy:
    external: true
    name: proxy