services:
 
  middleware:
    build: .
    environment:
      - DEBUG_MODE=true
      - TERMINOLOGY_BASE_URL=https://tx.fhir.ch/r4
      - REFDATA_API_KEY=${REFDATA_API_KEY:-}
    container_name: fhir-middleware
    expose:
      - "8000"
    networks:
      - default
      - fhir-net
    restart: unless-stopped
 
networks:
  fhir-net:
    external: true
    name: fhir-server_fhir-net